<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FieldNote — Firsthand Enterprise AI Deployment Evidence</title>
<meta name="description" content="FieldNote: learn from what named companies actually did with AI, with the evidence and the caveats intact. A Trueinfo Labs demo." />
<style>
  :root{
    --bg:#0b0d10; --panel:#15181e; --panel2:#1b1f27; --bg2:#0f1218;
    --border:#272c36; --border2:#333a46;
    --text:#e8eaee; --text2:#a2a9b4; --muted:#6c7480;
    --accent:#4b82f6; --accent-soft:rgba(75,130,246,.14); --gold:#e0b973;
    --a:#34d399; --b:#38bdf8; --c:#fbbf24; --d:#a1a1aa;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  /* header */
  header{position:sticky;top:0;z-index:20;background:rgba(11,13,16,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .nav{display:flex;align-items:center;gap:18px;height:62px}
  .brand{display:flex;align-items:center;gap:11px;cursor:pointer}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#1e2430,#12151b);border:1px solid #2a3140;display:flex;align-items:center;justify-content:center}
  .logo svg{width:20px;height:20px}
  .brand .wm{font-weight:800;font-size:19px;letter-spacing:-.02em;background:linear-gradient(90deg,#fff,var(--gold),#fff);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
  .brand .sub{font-size:8px;letter-spacing:.3em;color:#8a7a52;font-weight:600;margin-top:2px}
  .nav .spacer{flex:1}
  .nav a.link{font-size:14px;color:var(--text2);padding:6px 4px;border-bottom:2px solid transparent}
  .nav a.link.active{color:var(--text);border-bottom-color:var(--accent)}
  .nav a.link:hover{color:var(--text)}
  .demo-chip{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);border:1px solid #4a4026;background:#1c1810;padding:3px 8px;border-radius:999px}
  /* hero */
  .hero{padding:34px 0 10px}
  .hero .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--accent);border:1px solid #243552;background:#101826;padding:4px 10px;border-radius:999px;margin-bottom:14px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(75,130,246,.2)}
  .hero h1{font-size:28px;line-height:1.25;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
  .hero p{color:var(--text2);max-width:640px;margin:0;font-size:15px}
  /* tabs + search */
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 18px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap}
  .tab{font-size:13.5px;padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--text2);cursor:pointer}
  .tab.active{background:var(--accent-soft);border-color:#2f4d7a;color:#bcd0f5;font-weight:500}
  .tab:hover{color:var(--text)}
  .search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:7px 12px;min-width:210px}
  .search input{background:transparent;border:0;outline:0;color:var(--text);font-size:13.5px;width:100%}
  .search svg{width:15px;height:15px;color:var(--muted);flex:0 0 auto}
  .count{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  /* grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding-bottom:50px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s;display:flex;flex-direction:column}
  .card:hover{border-color:#39527d;transform:translateY(-2px)}
  .thumb{position:relative;height:150px;background:#0c0f14 center/cover no-repeat}
  .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(11,13,16,.6),transparent 55%)}
  .badge{position:absolute;top:10px;z-index:2;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;border:1px solid}
  .badge.grade{right:10px}
  .badge.fn{left:10px;background:rgba(0,0,0,.55);border-color:rgba(255,255,255,.12);color:#dfe3ea;font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:9.5px;padding:4px 8px}
  .g-a{background:rgba(52,211,153,.18);color:#6ee7b7;border-color:rgba(52,211,153,.4)}
  .g-b{background:rgba(56,189,248,.18);color:#7dd3fc;border-color:rgba(56,189,248,.4)}
  .g-c{background:rgba(251,191,36,.18);color:#fcd34d;border-color:rgba(251,191,36,.4)}
  .g-d{background:rgba(161,161,170,.18);color:#d4d4d8;border-color:rgba(161,161,170,.4)}
  .card .body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
  .card h3{margin:0;font-size:15px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
  .op{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--text2)}
  .op svg{width:13px;height:13px;margin-top:3px;color:var(--accent);flex:0 0 auto}
  .meta{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11px;color:var(--text2);background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:2px 8px}
  .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
  .foot .view{color:var(--accent)}
  .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-family:ui-monospace,Menlo,monospace;margin-bottom:3px}
  .outcome-line{display:flex;gap:7px;font-size:12.5px;color:var(--text2)}
  .outcome-line .b{color:var(--gold);margin-top:7px;width:4px;height:4px;border-radius:50%;background:var(--gold);flex:0 0 auto}
  /* detail */
  .back{display:inline-flex;align-items:center;gap:7px;color:var(--text2);font-size:13.5px;margin:26px 0 22px;cursor:pointer}
  .back:hover{color:var(--accent)}
  .back svg{width:15px;height:15px}
  .eyebrow2{font-size:13px;color:var(--text2);display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
  .eyebrow2 .co{color:var(--text);font-weight:600}
  .op40{opacity:.4}
  h2.title{font-size:26px;line-height:1.25;margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
  .byline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--text2);margin-bottom:4px}
  .verified{display:inline-flex;align-items:center;gap:4px;color:#4ade80}
  .toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--accent);margin:12px 0 2px;cursor:pointer}
  .toggle:hover{text-decoration:underline}
  .lead{font-size:16px;color:var(--text);margin:18px 0}
  .results{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
  .result{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
  .result .v{font-size:14px;font-weight:600}
  .sec{margin:26px 0}
  .sec h4{font-size:13.5px;font-weight:600;margin:0 0 8px}
  .sec p{font-size:14px;color:var(--text2);margin:0}
  .sec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
  .sec li{font-size:14px;color:var(--text2);display:flex;gap:9px}
  .sec li .bb{margin-top:8px;width:4px;height:4px;border-radius:50%;flex:0 0 auto}
  blockquote{margin:0 0 16px;border-left:2px solid #2d4e7a;padding-left:15px}
  blockquote p{font-style:italic;color:var(--text);margin:0;font-size:14px}
  blockquote .cite{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  blockquote .cite a{color:var(--accent);font-family:ui-monospace,Menlo,monospace;display:inline-flex;align-items:center;gap:4px}
  .src{padding-top:18px;border-top:1px solid var(--border);margin-top:22px}
  .src a{color:var(--accent);font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
  .grade-note{font-size:12.5px;color:var(--text2);margin-top:8px}
  .warn{color:#fbbf24}
  /* analyst block */
  .analyst{background:rgba(27,31,39,.5);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin:26px 0}
  .analyst .flag{font-size:11px;color:#f2c879;margin:2px 0 14px}
  .analyst .sub{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--b);font-family:ui-monospace,Menlo,monospace;margin:14px 0 7px}
  .analyst .sub:first-of-type{margin-top:0}
  .altrow{margin-bottom:11px}
  .altrow .u{font-size:13.5px;color:var(--text);font-weight:600}
  .altrow .cat{font-size:11.5px;color:var(--muted)}
  .replicate{background:rgba(75,130,246,.06);border:1px solid #27365a;border-radius:14px;padding:18px 20px;margin:26px 0}
  .replicate h4{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 14px}
  .mono-code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--text2);background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-top:8px}
  /* benchmarks */
  .bars{max-width:460px;display:flex;flex-direction:column;gap:11px}
  .bar-row{display:flex;align-items:center;gap:12px}
  .bar-row .lab{width:70px;font-size:12.5px;color:var(--text2)}
  .track{flex:1;height:20px;background:var(--panel);border:1px solid var(--border);border-radius:7px;overflow:hidden}
  .fill{height:100%;opacity:.85}
  .bar-row .n{width:26px;text-align:right;font-size:12.5px;font-family:ui-monospace,Menlo,monospace}
  .rec-row{display:block;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:9px;cursor:pointer}
  .rec-row:hover{border-color:#39527d}
  footer{border-top:1px solid var(--border);padding:26px 0 40px;color:var(--muted);font-size:12.5px;text-align:center}
  @media(max-width:560px){.hero h1{font-size:23px}.search{margin-left:0;width:100%}}
</style>
</head>
<body>
<header><div class="wrap nav">
  <div class="brand" onclick="go('')">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" fill="#e0b973"/><circle cx="12" cy="5" r="2" fill="#4b82f6"/><circle cx="19" cy="12" r="2" fill="#4b82f6"/><circle cx="12" cy="19" r="2" fill="#4b82f6"/><circle cx="5" cy="12" r="2" fill="#4b82f6"/></svg></div>
    <div><div class="wm">FieldNote</div><div class="sub">FIRSTHAND</div></div>
  </div>
  <div class="spacer"></div>
  <a class="link" id="nav-lib" onclick="go('')">Library</a>
  <a class="link" id="nav-bench" onclick="go('benchmarks')">Benchmarks</a>
  <span class="demo-chip">Demo</span>
</div></header>
<main id="app"><div class="wrap"><p style="color:var(--text2);padding:40px 0">Loading…</p></div></main>
<footer><div class="wrap">FieldNote — a Trueinfo Labs product. Firsthand enterprise AI deployment evidence. This is an interactive demo on real records; outcome figures are self-reported by the operators and not independently verified.</div></footer>

<script>
const SVG='<svg width="16" height="16" style="flex:0 0 auto;vertical-align:-3px" viewBox="0 0 24 24"';
const I = {
  user:SVG+' fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  play:SVG+' fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  arrow:SVG+' fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back:SVG+' fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>',
  check:SVG+' fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>',
  search:SVG+' fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>'
};
const FUNCS=[{v:'',l:'All functions'},{v:'customer-support',l:'Customer Support'},{v:'software-engineering',l:'Software Engineering'}];
const FN_LABEL={'customer-support':'Customer Support','software-engineering':'Software Engineering'};
let DATA=[], STATE={func:'',q:''};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gc=g=>'g-'+((g||'d').toLowerCase());
const mmss=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
const stamp=(r,t)=>r.videoUrl+(r.videoUrl.includes('?')?'&':'?')+'t='+t+'s';
const by=id=>DATA.find(r=>r.id===id);
const app=()=>document.getElementById('app');
function go(h){location.hash=h?('#/'+h):'#/';}

async function boot(){
  try{ DATA=await (await fetch('data.json',{cache:'no-store'})).json(); }
  catch(e){ app().innerHTML='<div class="wrap"><p style="color:#fbbf24;padding:40px 0">Could not load data.json</p></div>'; return; }
  window.addEventListener('hashchange',route); route();
}
function route(){
  const h=location.hash.replace(/^#\/?/,'');
  const parts=h.split('/').filter(Boolean);
  document.getElementById('nav-lib').classList.toggle('active',parts[0]!=='benchmarks');
  document.getElementById('nav-bench').classList.toggle('active',parts[0]==='benchmarks');
  window.scrollTo(0,0);
  if(parts[0]==='benchmarks') return renderBench();
  if(parts[0]==='r'&&parts[1]){ return parts[2]==='playbook'?renderPlaybook(parts[1]):renderRecord(parts[1]); }
  renderLibrary();
}

/* ---------- library ---------- */
function renderLibrary(){
  const q=STATE.q.toLowerCase();
  const list=DATA.filter(r=>(!STATE.func||r.func===STATE.func))
    .filter(r=>!q||[r.company,r.headline,r.title,(r.tags||[]).join(' ')].join(' ').toLowerCase().includes(q));
  const tabs=FUNCS.map(f=>`<div class="tab ${STATE.func===f.v?'active':''}" onclick="STATE.func='${f.v}';renderLibrary()">${f.l}</div>`).join('');
  const cards=list.map(cardHTML).join('')||`<p style="color:var(--text2)">No records match.</p>`;
  app().innerHTML=`<div class="wrap">
    <section class="hero">
      <div class="eyebrow"><span class="dot"></span> Firsthand only</div>
      <h1>The firsthand record of what enterprises actually did with AI.</h1>
      <p>Every record is a named operator from a named company describing their own deployment — with the evidence graded and the caveats intact.</p>
    </section>
    <div class="controls">
      <div class="tabs">${tabs}</div>
      <div class="search">${I.search}<input id="q" placeholder="Search company, tag…" value="${esc(STATE.q)}"></div>
    </div>
    <div class="count">${list.length} record${list.length===1?'':'s'}</div>
    <div class="grid" style="margin-top:14px">${cards}</div>
  </div>`;
  const qi=document.getElementById('q'); if(qi){qi.oninput=e=>{STATE.q=e.target.value; const pos=e.target.selectionStart; renderLibrary(); const n=document.getElementById('q'); if(n){n.focus();n.setSelectionRange(pos,pos);}};}
}
function cardHTML(r){
  const out=(r.outcomes||[]).slice(0,2).map(o=>`<div class="outcome-line"><span class="b"></span><span>${esc(o)}</span></div>`).join('');
  const tags=(r.tags||[]).slice(0,3).map(t=>`<span class="chip">${esc(t)}</span>`).join('');
  return `<div class="card" onclick="go('r/${r.id}')">
    <div class="thumb" style="background-image:url('${esc(r.thumbnail)}')">
      <span class="badge fn">${esc(FN_LABEL[r.func]||r.func)}</span>
      ${r.grade?`<span class="badge grade ${gc(r.grade)}">${esc(r.grade)}</span>`:''}
    </div>
    <div class="body">
      <h3>${esc(r.headline)}</h3>
      ${r.operator?`<div class="op">${I.user}<span>${esc(r.operator)}</span></div>`:''}
      <div class="meta">${esc(r.sourceType||'')}${r.recordedAt?' · '+fmtDate(r.recordedAt):''}</div>
      ${out?`<div class="label" style="margin-top:4px">Reported outcomes</div>${out}`:''}
      ${tags?`<div class="chips">${tags}</div>`:''}
      <div class="foot"><span>${esc(r.company)}</span><span class="view">View →</span></div>
    </div>
  </div>`;
}
function fmtDate(d){try{return new Date(d).toLocaleDateString(undefined,{month:'short',year:'numeric'})}catch(e){return d}}

/* ---------- record (outcome-led) ---------- */
function renderRecord(id){
  const r=by(id); if(!r) return go('');
  const results=(r.outcomes||[]).map(o=>`<div class="result"><div class="v">${esc(o)}</div></div>`).join('');
  app().innerHTML=`<div class="wrap">
    <div class="back" onclick="go('')">${I.back} Back to library</div>
    <div class="eyebrow2"><span class="co">${esc(r.company)}</span><span class="op40">·</span><span>${esc(FN_LABEL[r.func]||r.func)}</span>${r.grade?`<span class="op40">·</span><span class="badge ${gc(r.grade)}" style="position:static">Grade ${esc(r.grade)}</span>`:''}</div>
    <h2 class="title">${esc(r.headline)}</h2>
    <div class="byline">${r.operator?`<span>${esc(r.operator)}</span><span class="op40">·</span>`:''}<span>${esc(cap(r.sourceType))}${r.event?', '+esc(r.event):''} · ${fmtDate(r.recordedAt)}</span><span class="verified">${I.check} verified</span></div>
    <div class="toggle" onclick="go('r/${r.id}/playbook')">View as implementation playbook →</div>
    ${r.summary?`<p class="lead">${esc(r.summary)}</p>`:''}
    ${results?`<div class="results">${results}</div>`:''}
    ${r.approach?sec('What they did',`<p>${esc(r.approach)}</p>`):''}
    ${r.whyItMatters&&r.whyItMatters!==r.approach?sec('Why it matters',`<p>${esc(r.whyItMatters)}</p>`):''}
    ${pitfallsHTML(r)}
    ${quotesHTML(r)}
    <div class="src">
      <a href="${esc(r.videoUrl)}" target="_blank" rel="noopener">${I.play} ${esc(cap(r.sourceType)||'Source')}${r.recordedAt?', '+new Date(r.recordedAt).toLocaleDateString():''} (firsthand)</a>
      ${r.grade?`<div class="grade-note"><span class="badge ${gc(r.grade)}" style="position:static;margin-right:7px">Grade ${esc(r.grade)}</span>${esc(r.gradeRationale||'Graded on source strength, baseline presence and metric hygiene.')}</div>`:''}
    </div>
  </div>`;
}
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):'';
function sec(h,inner){return `<div class="sec"><h4>${h}</h4>${inner}</div>`;}
function pitfallsHTML(r){if(!(r.pitfalls||[]).length)return '';return `<div class="sec"><h4 class="warn">⚠ Watch-outs</h4><ul>${r.pitfalls.map(p=>`<li><span class="bb" style="background:#fbbf24"></span><span>${p.label?`<strong style="color:var(--text)">${esc(p.label)}:</strong> `:''}${esc(p.text)}</span></li>`).join('')}</ul></div>`;}
function quotesHTML(r){if(!(r.quotes||[]).length)return '';return `<div class="sec"><h4>In their words</h4>${r.quotes.map(q=>`<blockquote><p>“${esc(q.quote)}”</p><div class="cite">${[q.speaker,cap(r.sourceType)].filter(Boolean).map(esc).join(' · ')}${typeof q.t==='number'?` <a href="${esc(stamp(r,q.t))}" target="_blank" rel="noopener">${I.play} ${mmss(q.t)}</a>`:''}</div></blockquote>`).join('')}</div>`;}

/* ---------- playbook ---------- */
function renderPlaybook(id){
  const r=by(id); if(!r) return go('');
  const e=r.enrichment||{};
  const alt=(e.alternatives||[]).map(a=>`<div class="altrow"><span class="u">${esc(a.used)}</span>${a.category?`<span class="cat"> · ${esc(a.category)}</span>`:''}<div class="chips" style="margin-top:5px">${(a.options||[]).map(o=>`<span class="chip">${esc(o)}</span>`).join('')}</div></div>`).join('');
  const mdefs=(e.metric_definitions||[]).map(m=>`<div style="margin-bottom:10px;font-size:14px;color:var(--text2)">${m.metric?`<strong style="color:var(--text)">${esc(m.metric)}:</strong> `:''}${esc(m.means)}</div>`).join('');
  const prereq=(e.prerequisites||[]).map(p=>`<li><span class="bb" style="background:var(--accent)"></span><span>${esc(p)}</span></li>`).join('');
  app().innerHTML=`<div class="wrap">
    <div class="back" onclick="go('r/${r.id}')">${I.back} Back to the record</div>
    <div class="label">Implementation playbook</div>
    <h2 class="title">How ${esc(r.company)} built it</h2>
    ${r.solutionName?`<p style="color:var(--text2);margin:2px 0 0">${esc(r.solutionName)}</p>`:''}
    <div class="byline" style="margin-top:10px">${r.operator?`<span>${esc(r.operator)}</span><span class="op40">·</span>`:''}<span>${esc(cap(r.sourceType))} · ${fmtDate(r.recordedAt)}</span>${r.grade?`<span class="badge ${gc(r.grade)}" style="position:static">Grade ${esc(r.grade)}</span>`:''}</div>
    ${e.time_to_value?`<div style="font-size:12.5px;color:var(--text2);margin-top:8px">⏱ Time to value: ${esc(e.time_to_value)}</div>`:''}
    ${r.approach?sec('The approach',`<p>${esc(r.approach)}</p>`):''}
    <div class="replicate">
      <h4>${I.check} What you’d need to replicate this</h4>
      ${r.stack&&r.stack.length?`<div class="analyst sub" style="margin-top:0;background:none;border:0;padding:0">Stack to assemble</div><div class="chips" style="margin-bottom:12px">${r.stack.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>`:''}
      ${r.enablingTech&&r.enablingTech.length?`<div class="analyst sub" style="background:none;border:0;padding:0">Key integration</div>${r.enablingTech.map(t=>`<p style="font-size:13.5px;color:var(--text2);margin:0 0 8px">${t.label?`<strong style="color:var(--text)">${esc(t.label)}:</strong> `:''}${esc(t.text)}</p>`).join('')}`:''}
      ${r.orgPrereq?`<div class="analyst sub" style="background:none;border:0;padding:0">Org prerequisites</div><p style="font-size:13.5px;color:var(--text2);margin:0 0 8px">${esc(r.orgPrereq)}</p>`:''}
      ${r.owner&&(r.owner.persona||r.owner.role)?`<div class="analyst sub" style="background:none;border:0;padding:0">Who should own it</div><p style="font-size:13.5px;color:var(--text2);margin:0">${r.owner.persona?`<strong style="color:var(--text)">${esc(r.owner.persona)}</strong>`:''}${r.owner.role?' — '+esc(r.owner.role):''}</p>`:''}
    </div>
    ${prereq?`<div class="sec"><h4>${I.check} Before you start — readiness</h4><ul>${prereq}</ul></div>`:''}
    ${(alt||e.cost||e.roi)?`<div class="analyst">
      <div style="font-size:14px;font-weight:600">Alternatives, cost and ROI</div>
      <div class="flag">Market context and framework from FieldNote analysis — not stated by the deployer.</div>
      ${alt?`<div class="sub">Alternatives to this stack</div>${alt}`:''}
      ${e.cost?`<div class="sub">What it likely costs</div>${e.cost.disclosed===false?`<p class="warn" style="font-size:13.5px;margin:0 0 7px">Not disclosed. ${esc(e.cost.note||'')}</p>`:''}<ul style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px">${(e.cost.drivers||[]).map(d=>`<li style="font-size:13.5px;color:var(--text2);display:flex;gap:8px"><span class="bb" style="background:var(--b);margin-top:8px"></span><span>${esc(d)}</span></li>`).join('')}</ul>`:''}
      ${e.roi?`<div class="sub">ROI</div>${e.roi.claimed_benefit?`<p style="font-size:13.5px;color:var(--text2);margin:0"><strong style="color:var(--text)">Claimed benefit:</strong> ${esc(e.roi.claimed_benefit)}</p>`:''}${e.roi.missing?`<p class="warn" style="font-size:13.5px;margin:4px 0 0">${esc(e.roi.missing)}</p>`:''}${e.roi.formula?`<div class="mono-code">${esc(e.roi.formula)}</div>`:''}`:''}
    </div>`:''}
    ${(r.steps&&r.steps.length)?`<div class="sec"><h4>How it works</h4><ul>${r.steps.map((s,i)=>`<li><span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--b);margin-top:1px">${String(i+1).padStart(2,'0')}</span><span>${esc(s)}</span></li>`).join('')}</ul>${r.channels&&r.channels.length?`<div style="font-size:12px;color:var(--muted);margin-top:8px">Channels: ${r.channels.map(esc).join(' · ')}</div>`:''}</div>`:''}
    ${mdefs?`<div class="sec"><h4>What the metrics mean</h4><div class="flag" style="margin:-4px 0 10px">Definitions matter: deflection, resolution and containment are not the same thing.</div>${mdefs}</div>`:''}
    ${pitfallsHTML(r)}
    ${(r.outcomes||[]).length?`<div class="sec" style="background:rgba(27,31,39,.4);border:1px solid var(--border);border-radius:12px;padding:14px 16px"><h4>Reported outcomes</h4><div class="flag" style="margin:-4px 0 9px">Self-reported by the presenter. Not independently verified.</div><div class="chips">${r.outcomes.map(o=>`<span class="chip">${esc(o)}</span>`).join('')}</div></div>`:''}
    ${quotesHTML(r)}
    <div class="src"><a href="${esc(r.videoUrl)}" target="_blank" rel="noopener">${I.play} Source: ${esc(cap(r.sourceType)||'video')} (firsthand)</a></div>
  </div>`;
}

/* ---------- benchmarks ---------- */
function renderBench(){
  const dist={A:0,B:0,C:0,D:0}; const tagc={}; const fnc={};
  DATA.forEach(r=>{const g=(r.grade||'').toUpperCase(); if(dist[g]!=null)dist[g]++; (r.tags||[]).forEach(t=>tagc[t]=(tagc[t]||0)+1); fnc[r.func]=(fnc[r.func]||0)+1;});
  const maxg=Math.max(1,...Object.values(dist));
  const gcol={A:'var(--a)',B:'var(--b)',C:'var(--c)',D:'var(--d)'};
  const bars=['A','B','C','D'].map(g=>`<div class="bar-row"><span class="lab">Grade ${g}</span><div class="track"><div class="fill" style="width:${dist[g]/maxg*100}%;background:${gcol[g]}"></div></div><span class="n">${dist[g]}</span></div>`).join('');
  const tags=Object.entries(tagc).sort((a,b)=>b[1]-a[1]).map(([t,c])=>`<span class="chip" style="cursor:pointer" onclick="STATE.func='';STATE.q='${esc(t)}';go('')">#${esc(t)} <span style="color:var(--text);font-family:ui-monospace">${c}</span></span>`).join('');
  const fns=Object.entries(fnc).map(([f,c])=>`<span class="chip">${esc(FN_LABEL[f]||f)} <span style="color:var(--text);font-family:ui-monospace">${c}</span></span>`).join('');
  const rows=DATA.map(r=>`<div class="rec-row" onclick="go('r/${r.id}')"><div style="display:flex;gap:9px;align-items:center;margin-bottom:${(r.outcomes||[]).length?'7px':'0'}"><span style="font-size:14px;font-weight:600">${esc(r.company)}</span>${r.grade?`<span class="badge ${gc(r.grade)}" style="position:static;font-size:10px">${esc(r.grade)}</span>`:''}<span class="chip" style="font-size:9.5px">${esc(FN_LABEL[r.func]||r.func)}</span></div>${(r.outcomes||[]).length?`<div class="chips">${r.outcomes.map(o=>`<span class="chip">${esc(o)}</span>`).join('')}</div>`:''}</div>`).join('');
  app().innerHTML=`<div class="wrap">
    <section class="hero"><h1 style="font-size:24px">Benchmarks</h1><p>Patterns across ${DATA.length} firsthand records. Outcomes are self-reported by the operators and not independently verified.</p></section>
    <div class="sec"><h4>Evidence quality</h4><div class="bars">${bars}</div><p style="font-size:12px;color:var(--text2);margin-top:12px">A independent/audited · B first-party with metrics · C qualitative or vendor talk · D demo/unverified.</p></div>
    <div class="sec"><h4>Function coverage</h4><div class="chips">${fns}</div></div>
    <div class="sec"><h4>Workflow coverage</h4><div class="chips">${tags}</div></div>
    <div class="sec"><h4>Reported outcomes across records</h4><div class="flag" style="margin:-4px 0 10px;font-size:11px;color:#f2c879">Self-reported, not independently verified.</div>${rows}</div>
  </div>`;
}
boot();
</script>
</body>
</html>
